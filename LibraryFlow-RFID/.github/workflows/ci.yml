name: prototype-checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r LibraryFlow-RFID/requirements.txt
      - run: cd LibraryFlow-RFID && python -m pytest -q
