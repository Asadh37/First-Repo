name: LibraryFlow prototype checks
on:
  push:
    branches: [main, "feat/libraryflow-rfid-prototype"]
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LibraryFlow-RFID
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: LibraryFlow-RFID/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
